<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Web Chat Project</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    //NAV BAR
    <header>
      <div class="center">
        <h2>Turning Overload Into Artistry</h2>
        <h3>What are we working on today?</h3>
      </div>

      <div class="spacer-vertical-small"></div>

      <div id="tool-nav" class="center">
        <button data-tool="chat">Chatbot</button>
        <button data-tool="decoder">Decoder</button>
        <button data-tool="planner">Planner</button>
        <button data-tool="checklist">Checklist</button>
      </div>
    </header>

    <main>
      <div class="spacer-vertical-medium"></div>

      <!-- Chatbot Tool Panel -->
      <div id="tool-chat" class="tool-panel">
        <h2>Chatbot</h2>
        <!-- Place your chatbot UI elements here -->
        <form id="chat-form">
          <div id="chat-box" class="center">
            <input
              id="user-name"
              class="input-box"
              type="text"
              placeholder="Enter your name"
            />
          </div>
          <button type="submit">Send</button>
        </form>
        <div id="chat-messages"></div>
      </div>

      <!-- Decoder Tool Panel -->
      <div id="tool-decoder" class="tool-panel" style="display: none">
        <h2>Decoder</h2>
        <!-- Place your decoder UI elements here -->
        <input
          id="unloader-input"
          type="text"
          placeholder="Enter your thoughts..."
        />
        <button id="unloader-submit">Decode</button>
        <div id="unloader-output"></div>
      </div>

      <!-- Planner Tool Panel -->
      <div id="tool-planner" class="tool-panel" style="display: none">
        <h2>Planner</h2>
        <!-- Planner UI elements go here -->
        <p>Planner tool coming soon!</p>
      </div>

      <!-- Checklist Tool Panel -->
      <div id="tool-checklist" class="tool-panel" style="display: none">
        <h2>Checklist</h2>
              </div>

        <p>Checklist tool coming soon!</p>
      </div>
    </main>
    <script src="chatbot.js"></script>
    <script src="unloader.js"></script>
  </body>
</html>
